name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    # 仅在可信标签上发布；通过 PyPI Trusted Publishing（OIDC）认证，
    # 不需要任何 API token 或 secret。PyPI 侧需配置：
    # owner=AlanNiew, repo=code-review-mcp, workflow=publish.yml, environment=pypi
    environment: pypi

    permissions:
      id-token: write  # Trusted Publishing 依赖 OIDC 短时令牌
      contents: write  # 创建 GitHub Release 需要写 contents（否则 release 步骤 403）

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distribution
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
