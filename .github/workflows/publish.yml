name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    # 仅在可信标签上发布；通过 PyPI Trusted Publishing（OIDC）认证，
    # 不需要任何 API token 或 secret。PyPI 侧需配置：
    # owner=AlanNiew, repo=code-review-mcp, workflow=publish.yml, environment=pypi
    environment: pypi

    permissions:
      id-token: write  # Trusted Publishing 依赖 OIDC 短时令牌

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distribution
        run: python -m build

      - name: Publish to PyPI
        id: publish
        uses: pypa/gh-action-pypi-publish@release/v1

      # 临时诊断：发布失败时把 PyPI Trusted Publisher 的判定结果写进注解，
      # 注解可被公开读取，便于在没有仓库 admin 权限时定位 claims 不匹配。
      - name: Diagnose trusted publisher mismatch
        if: steps.publish.outcome == 'failure'
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.request

          def emit(kind, text):
              print("::%s::%s" % (kind, " ".join(str(text).split())[:900]))

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=pypi"
          req = urllib.request.Request(
              url,
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          oidc = json.load(urllib.request.urlopen(req))["value"]
          payload = oidc.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          emit("warning", "claims=" + json.dumps(claims, separators=(",", ":")))

          mint = urllib.request.Request(
              "https://pypi.org/_/oidc/mint-token",
              data=json.dumps({"token": oidc}).encode(),
              headers={"Content-Type": "application/json"},
          )
          try:
              resp = urllib.request.urlopen(mint)
              emit("error", "mint-status=%s body=%s" % (resp.status, resp.read()[:600]))
          except urllib.error.HTTPError as exc:
              emit("error", "mint-status=%s body=%s" % (exc.code, exc.read()[:600]))
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
